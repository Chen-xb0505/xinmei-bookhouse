<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>馨妹书屋 · 学习与趣味游戏</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #fef9e7 0%, #e8f8f5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    #app {
      width: 100%;
      max-width: 520px;
      background: #ffffffdd;
      backdrop-filter: blur(6px);
      border-radius: 48px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.06);
      padding: 24px 20px 32px;
      transition: all 0.2s ease;
      border: 2px solid #ffffff;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 6px;
      gap: 8px;
    }

    .left-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn {
      background: #ffffff;
      border: none;
      border-radius: 50px;
      width: 48px;
      height: 48px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #cbdae8, 0 6px 10px -4px rgba(0, 0, 0, 0.1);
      transition: all 0.08s;
      color: #4a6fa5;
      flex-shrink: 0;
    }

    .back-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #cbdae8, 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    .module-title {
      font-size: 22px;
      font-weight: 700;
      color: #4a6fa5;
      letter-spacing: 1px;
      background: #eef4ff;
      padding: 6px 16px;
      border-radius: 50px;
      box-shadow: inset 0 -2px 0 #b8d0f0;
      white-space: nowrap;
    }

    .stars-box {
      background: #fff8e0;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: 600;
      color: #d4a017;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #ffe9a7;
      flex-shrink: 0;
    }

    .stars-box span {
      font-size: 28px;
      line-height: 1;
    }

    .progress-area {
      margin: 6px 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-track {
      flex: 1;
      height: 14px;
      background: #e2eaf1;
      border-radius: 50px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6ec6ff, #4a9eff);
      border-radius: 50px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .progress-text {
      font-size: 15px;
      font-weight: 600;
      color: #5f7d9c;
      background: #ffffffcc;
      padding: 4px 12px;
      border-radius: 40px;
      white-space: nowrap;
    }

    .question-card {
      background: #ffffff;
      border-radius: 36px;
      padding: 28px 16px 22px;
      margin: 8px 0 22px;
      box-shadow: 0 10px 18px -8px rgba(0, 40, 80, 0.08), 0 0 0 2px #ffffff, 0 0 0 4px #e5f0fa;
      position: relative;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .question-text {
      font-size: 32px;
      font-weight: 700;
      color: #1f3b5c;
      text-align: center;
      line-height: 1.4;
      word-break: break-word;
      padding: 0 8px;
    }

    .speaker-icon {
      position: absolute;
      right: 18px;
      top: 18px;
      font-size: 34px;
      cursor: pointer;
      opacity: 0.8;
      transition: transform 0.15s, opacity 0.2s;
      background: #eef6ff;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.04);
      user-select: none;
    }

    .speaker-icon:active {
      transform: scale(0.88);
      opacity: 1;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 18px 0 8px;
    }

    .option-btn {
      background: #ffffff;
      border: none;
      border-radius: 32px;
      padding: 20px 8px;
      font-size: 26px;
      font-weight: 600;
      color: #1f3b5c;
      box-shadow: 0 6px 0 #cbdae8, 0 10px 16px -6px rgba(0, 0, 0, 0.12);
      transition: all 0.08s ease;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      word-break: break-word;
      line-height: 1.2;
      border: 2px solid #ffffff;
    }

    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #cbdae8, 0 8px 12px -6px rgba(0, 0, 0, 0.1);
    }

    .option-btn.correct-highlight {
      background: #d4f0d0;
      border-color: #7ec87e;
      box-shadow: 0 0 0 4px #b8e6b8;
      color: #1e6b1e;
    }

    .option-btn.wrong-highlight {
      background: #ffe0e0;
      border-color: #f4a0a0;
      box-shadow: 0 0 0 4px #fcc;
      color: #a13d3d;
    }

    .option-btn:disabled {
      opacity: 0.7;
      transform: translateY(0);
      box-shadow: 0 6px 0 #cbdae8, 0 10px 16px -6px rgba(0, 0, 0, 0.12);
      cursor: default;
    }

    .feedback {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      min-height: 56px;
      margin: 10px 0 0;
      padding: 8px 12px;
      border-radius: 30px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      line-height: 1.3;
    }

    .feedback.correct {
      color: #2a7a2a;
      background: #e6f9e6;
    }

    .feedback.wrong {
      color: #b34a4a;
      background: #ffecec;
    }

    .next-btn {
      background: #6ec6ff;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 18px 24px;
      font-size: 24px;
      font-weight: 700;
      width: 100%;
      margin-top: 18px;
      box-shadow: 0 6px 0 #3d8fd1, 0 12px 18px -6px rgba(0, 110, 200, 0.3);
      transition: all 0.08s;
      cursor: pointer;
      letter-spacing: 2px;
      display: none;
    }

    .next-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #3d8fd1, 0 10px 14px -6px rgba(0, 110, 200, 0.3);
    }

    /* 首页 */
    .home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px 8px 12px;
    }

    .home-title {
      font-size: 36px;
      font-weight: 800;
      color: #2d4b6e;
      margin-bottom: 4px;
      text-shadow: 3px 3px 0 #d0e2f5;
      letter-spacing: 2px;
    }

    /* 年级选择区 */
    .grade-section {
      width: 100%;
      background: #f5faff;
      border-radius: 32px;
      padding: 14px 12px;
      box-shadow: inset 0 0 0 2px #d6e8ff;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .grade-label {
      font-size: 18px;
      font-weight: 700;
      color: #5f7d9c;
      text-align: center;
      letter-spacing: 1px;
    }

    .grade-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .grade-btn {
      background: #ffffff;
      border: 2px solid #d6e8ff;
      border-radius: 18px;
      padding: 12px 2px;
      font-size: 20px;
      font-weight: 700;
      color: #4a6fa5;
      cursor: pointer;
      transition: all 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      line-height: 1.2;
    }

    .grade-btn .grade-sub {
      font-size: 11px;
      font-weight: 500;
      color: #9ab0c8;
    }

    .grade-btn:active {
      transform: scale(0.94);
    }

    .grade-btn.active {
      background: #6ec6ff;
      border-color: #3d8fd1;
      color: #ffffff;
      box-shadow: 0 4px 0 #3d8fd1, 0 6px 10px -4px rgba(0, 110, 200, 0.3);
      transform: translateY(0);
    }

    .grade-btn.active .grade-sub {
      color: #e0f0ff;
    }

    /* 禁用状态 */
    .grade-btn.disabled {
      background: #f0f3f7;
      border-color: #e2e8f0;
      color: #b0c0d0;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .grade-btn.disabled .grade-sub {
      color: #c0cdd8;
    }

    .grade-btn.disabled:active {
      transform: none;
    }

    /* 模块按钮 */
    .module-btn {
      width: 100%;
      background: #ffffff;
      border: none;
      border-radius: 40px;
      padding: 26px 20px;
      font-size: 32px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      box-shadow: 0 8px 0 #cbdae8, 0 14px 20px -8px rgba(0, 0, 0, 0.12);
      transition: all 0.08s;
      cursor: pointer;
      color: #1f3b5c;
      border: 2px solid #ffffff;
    }

    .module-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #cbdae8, 0 12px 16px -8px rgba(0, 0, 0, 0.1);
    }

    .module-btn span {
      font-size: 44px;
    }

    .module-btn:disabled {
      background: #f0f3f7;
      color: #b0c0d0;
      box-shadow: 0 8px 0 #e2e8f0, 0 14px 20px -8px rgba(0, 0, 0, 0.06);
      cursor: not-allowed;
      transform: none;
    }

    /* 结算页 */
    .result-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 10px 6px 6px;
    }

    .result-emoji {
      font-size: 76px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .result-title {
      font-size: 34px;
      font-weight: 800;
      color: #2d4b6e;
    }

    .result-stats {
      background: #f2f8ff;
      padding: 18px 28px;
      border-radius: 50px;
      font-size: 26px;
      font-weight: 600;
      color: #3a5f85;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 10px 0 4px;
      border: 2px dashed #b8d0f0;
    }

    .result-stats span {
      font-size: 30px;
      color: #d4a017;
    }

    .result-msg {
      font-size: 22px;
      color: #4a6a88;
      text-align: center;
      padding: 6px;
      font-weight: 500;
    }

    .restart-btn {
      background: #ffb74d;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 20px 30px;
      font-size: 28px;
      font-weight: 700;
      width: 100%;
      box-shadow: 0 6px 0 #e09e2f, 0 12px 18px -6px rgba(200, 120, 0, 0.3);
      transition: all 0.08s;
      cursor: pointer;
      margin-top: 12px;
      letter-spacing: 2px;
    }

    .restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #e09e2f, 0 10px 14px -6px rgba(200, 120, 0, 0.3);
    }

    .back-home {
      margin-top: 8px;
      font-size: 20px;
      color: #6f8faf;
      background: none;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      text-decoration: underline;
      font-weight: 500;
    }

    .hidden {
      display: none !important;
    }

    /* 提示条 */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d4b6e;
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      z-index: 200;
      animation: toastIn 0.3s ease;
      white-space: nowrap;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* 确认弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 40px;
      padding: 28px 24px 24px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .modal-box .modal-emoji {
      font-size: 52px;
      margin-bottom: 8px;
    }

    .modal-box .modal-text {
      font-size: 24px;
      font-weight: 700;
      color: #2d4b6e;
      margin-bottom: 6px;
    }

    .modal-box .modal-sub {
      font-size: 17px;
      color: #6f8faf;
      margin-bottom: 22px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      flex: 1;
      border: none;
      border-radius: 40px;
      padding: 16px 10px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.08s;
    }

    .modal-btn.cancel {
      background: #eef4ff;
      color: #4a6fa5;
      box-shadow: 0 4px 0 #cbdae8;
    }

    .modal-btn.cancel:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #cbdae8;
    }

    .modal-btn.confirm {
      background: #ff8a80;
      color: #ffffff;
      box-shadow: 0 4px 0 #d96b62;
    }

    .modal-btn.confirm:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d96b62;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.6); }
      100% { transform: scale(1); }
    }

    .star-pop {
      animation: pop 0.3s ease;
    }

    /* 趣味游戏：单文件、离线可玩 */
    .games-entry { background: #fff3dc; color: #8a591e; }
    .games-intro { color: #647c92; font-size: 16px; line-height: 1.7; margin: 8px 4px 24px; }
    .game-link {
      width: 100%; border: 2px solid #f4d9a6; border-radius: 28px;
      padding: 24px; background: #fff9ed; text-align: left; cursor: pointer;
      color: #243e59; display: flex; align-items: center; gap: 18px;
      box-shadow: 0 6px 0 #f0dfbe;
    }
    .game-link-icon {
      background: #ffc969; border-radius: 20px; width: 76px; height: 76px;
      display: grid; place-items: center; font-size: 40px; font-weight: 800; flex-shrink: 0;
    }
    .game-link strong { display: block; font-size: 27px; margin-bottom: 7px; }
    .game-link small { display: block; font-size: 14px; line-height: 1.7; color: #6f785e; }
    .game24-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 14px; }
    .game24-mode {
      border: 2px solid #dce8f0; border-radius: 20px; background: white;
      padding: 13px 8px; color: #526c86; font: inherit; cursor: pointer;
    }
    .game24-mode strong { display: block; font-size: 20px; margin-bottom: 4px; }
    .game24-mode small { font-size: 12px; }
    .game24-mode[aria-pressed="true"] { border-color: #e3aa41; background: #fff4d8; color: #785116; }
    .game24-summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .game24-summary p { color: #6a8094; font-size: 14px; }
    .game24-score { color: #88621f; background: #fff4d8; padding: 7px 12px; border-radius: 30px; white-space: nowrap; font-size: 14px; }
    .game24-target { text-align: center; margin: 14px 0 10px; color: #456179; }
    .game24-target strong { display: inline-block; font-size: 56px; line-height: 1.1; color: #243e59; margin-left: 8px; vertical-align: middle; }
    .game24-rules { font-size: 14px; line-height: 1.7; text-align: center; color: #667d91; min-height: 48px; }
    .game24-hand { margin: 10px 0 14px; font-size: 13px; text-align: center; color: #718395; }
    .game24-numbers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .game24-number {
      min-width: 0; min-height: 94px; border: 2px solid #d8e6f1; border-radius: 21px;
      background: #f5faff; color: #244560; padding: 10px 3px 8px; cursor: pointer;
      box-shadow: 0 5px 0 #d8e6f1; transition: background .12s, transform .12s;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .game24-number strong { font-size: 32px; line-height: 1.2; overflow-wrap: anywhere; }
    .game24-number small { font-size: 11px; line-height: 1.5; margin-top: 6px; color: #6b8194; }
    .game24-number[aria-pressed="true"] { border-color: #d9a443; background: #ffefc4; box-shadow: 0 5px 0 #e9c77e; }
    .game24-number[aria-pressed="true"] small { color: #805717; font-weight: 700; }
    .game24-number:disabled { cursor: default; }
    .game24-number.is-win { background: #e5f6e6; border-color: #8ebd91; box-shadow: 0 5px 0 #b9d9bb; }
    .game24-workbench { margin-top: 21px; background: #f4f8fb; border-radius: 24px; padding: 16px 12px; }
    .game24-help { font-size: 13px; color: #60778c; text-align: center; margin-bottom: 13px; }
    .game24-operators { display: flex; justify-content: center; gap: 12px; }
    .game24-op {
      width: 58px; height: 50px; font-size: 29px; color: #365b78; border: 2px solid #d4e3ef;
      border-radius: 15px; background: white; cursor: pointer;
    }
    .game24-op[aria-pressed="true"] { background: #dcefff; border-color: #589acb; color: #174d76; }
    .game24-expression { min-height: 48px; display: flex; justify-content: center; align-items: center; gap: 8px; margin: 10px 0 6px; }
    #game24Expression { font-size: 23px; font-weight: 700; color: #29465e; overflow-wrap: anywhere; }
    .game24-swap { background: white; border: 1px solid #ccdce8; color: #506e86; border-radius: 20px; font: inherit; font-size: 12px; padding: 8px 10px; cursor: pointer; }
    .game24-calculate {
      background: #428ac2; border: none; border-radius: 18px; width: 100%; padding: 13px 10px;
      color: white; font: inherit; font-size: 21px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 0 #306b99;
    }
    .game24-calculate:disabled { background: #c8d8e5; box-shadow: none; color: #57738a; cursor: default; }
    .game24-status { min-height: 60px; padding: 13px 8px; text-align: center; color: #567187; font-size: 15px; line-height: 1.6; }
    .game24-status[data-kind="success"] { color: #287041; background: #eaf8ed; border-radius: 18px; }
    .game24-status[data-kind="error"] { color: #9b523a; }
    .game24-tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0 12px; }
    .game24-tool { padding: 11px 4px; border-radius: 16px; border: 1px solid #d6e4ee; background: white; color: #49667e; font: inherit; font-size: 14px; cursor: pointer; }
    .game24-tool:disabled, .game24-swap:disabled, .game24-op:disabled { opacity: .45; cursor: default; }
    .game24-history { color: #547087; font-size: 14px; line-height: 1.8; padding: 9px 12px; background: #f5f9fc; border-radius: 16px; margin-bottom: 12px; }
    .game24-history ol { padding-left: 23px; }
    .game24-answer { border: 1px dashed #dbbc7b; border-radius: 16px; background: #fff9eb; padding: 13px; font-size: 14px; line-height: 1.8; margin-bottom: 12px; color: #795d31; }
    .game24-answer p { overflow-wrap: anywhere; }
    .game24-new { width: 100%; border: none; border-radius: 22px; background: #ffd080; color: #69481d; font: inherit; font-size: 20px; font-weight: 700; padding: 15px; box-shadow: 0 4px 0 #e6b25d; cursor: pointer; }
    .game24-answer-toggle { display: block; margin: 16px auto 0; padding: 6px; background: none; border: none; color: #5d7b94; font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; }
    #gamesScreen button:focus-visible, #game24Screen button:focus-visible, #gamesEntryBtn:focus-visible { outline: 3px solid #356faa; outline-offset: 4px; }
    @media (max-width: 360px) {
      .game24-numbers { gap: 7px; }
      .game24-number { min-height: 84px; border-radius: 16px; }
      .game24-number strong { font-size: 26px; }
      .game24-mode small { font-size: 11px; }
      .game24-op { width: 48px; }
      #game24Expression { font-size: 20px; }
    }

    @media (max-width: 400px) {
      .question-text { font-size: 28px; }
      .option-btn { font-size: 22px; padding: 16px 6px; min-height: 70px; }
      .module-btn { font-size: 28px; padding: 22px 14px; }
      .module-btn span { font-size: 38px; }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateMathOptions(correct) {
    const opts = new Set([correct]);
    let attempts = 0;
    while (opts.size < 4 && attempts < 200) {
      attempts++;
      const delta = Math.floor(Math.random() * 11) - 5;
      const wrong = correct + delta;
      if (wrong >= 0 && wrong <= 100 && wrong !== correct) {
        opts.add(wrong);
      }
    }
    let offset = 1;
    while (opts.size < 4) {
      if (correct + offset <= 100 && !opts.has(correct + offset)) opts.add(correct + offset);
      if (correct - offset >= 0 && !opts.has(correct - offset)) opts.add(correct - offset);
      offset++;
    }
    return shuffle([...opts]);
  }

  // ==================== 按年级汇总题库 ====================
  const gradeBank = {

  // ==================== 语音 ====================
  function speak(text, lang = 'zh-CN') {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();

    // 优先匹配语言的语音包
    const voices = window.speechSynthesis.getVoices();
    let voice = voices.find(v => v.lang === lang);
    if (!voice) {
      voice = voices.find(v => v.lang && v.lang.startsWith(lang.split('-')[0]));
    }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    if (voice) utterance.voice = voice;
    utterance.rate = 0.85;   // 稍慢，小朋友听得清
    utterance.pitch = 1.05;
    utterance.volume = 1;
    window.speechSynthesis.speak(utterance);
  }

  // iOS 需要先触摸页面才能播放语音
  document.addEventListener('touchstart', function unlockSpeech() {
    try {
      const u = new SpeechSynthesisUtterance('');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
    document.removeEventListener('touchstart', unlockSpeech);
  }, { once: true });

  // ==================== 音效 ====================
  function playTone(freq, duration = 0.15, type = 'sine') {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = 0.08;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }
  function playCorrectSound() {
    playTone(880, 0.12, 'sine');
    setTimeout(() => playTone(1100, 0.12, 'sine'), 100);
  }
  function playWrongSound() {
    playTone(300, 0.2, 'sawtooth');
  }

  // ==================== 随机抽题 ====================
  const QUESTIONS_PER_ROUND = 20;

  function pickQuestions(grade, moduleKey, n) {
    const gradeData = gradeBank[grade];
    if (!gradeData || !gradeData[moduleKey]) return null;
    const pool = gradeData[moduleKey];
    if (!pool || pool.length === 0) return null;
    const shuffled = shuffle(pool);
    return shuffled.slice(0, n);
  }

  // ==================== 游戏逻辑 ====================
  function startModule(moduleKey) {
    const mod = moduleMeta[moduleKey];
    if (!mod) return;

    const picked = pickQuestions(currentGrade, moduleKey, QUESTIONS_PER_ROUND);
    if (!picked) {
      showToast('该模块暂未开放，敬请期待');
      return;
    }

    currentModule = moduleKey;
    questions = picked;
    currentIndex = 0;
    stars = 0;
    correctCount = 0;
    answered = false;

    const gradeText = ['一', '二', '三', '四', '五', '六'][currentGrade - 1] + '年级';
    moduleTitle.textContent = `${gradeText} · ${mod.title}`;
    starCount.textContent = stars;

    homeScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');
    resultScreen.classList.add('hidden');

    loadQuestion();
  }

  function loadQuestion() {
    if (currentIndex >= questions.length) {
      showResult();
      return;
    }

    const q = questions[currentIndex];
    answered = false;

    questionText.textContent = q.question;

    const mod = moduleMeta[currentModule];
    if (mod.speakLang && q.speak) {
      speakerBtn.classList.remove('hidden');
      // 语文读整道题，英语读单词
      speakerBtn.onclick = () => {
        const text = (currentModule === 'pinyin') ? q.question : q.speak;
        speak(text, mod.speakLang);
      };
    } else {
      speakerBtn.classList.add('hidden');
    }

    optionsContainer.innerHTML = '';
    const shuffledOptions = shuffle([...q.options]);
    shuffledOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.dataset.value = opt;
      // 关键修复：传入时统一转为字符串，避免数字和字符串比较失败
      btn.addEventListener('click', () => handleOptionClick(btn, String(opt), String(q.answer)));
      optionsContainer.appendChild(btn);
    });

    nextBtn.style.display = 'none';
    feedbackMsg.textContent = '';
    feedbackMsg.className = 'feedback';

    const total = questions.length;
    const percent = (currentIndex / total) * 100;
    progressFill.style.width = percent + '%';
    progressText.textContent = `${currentIndex + 1}/${total}`;
  }

  function handleOptionClick(btn, selected, correctAnswer) {
    if (answered) return;
    answered = true;

    // 双重保险：统一转成字符串再比较
    const selectedStr = String(selected);
    const correctStr = String(correctAnswer);

    const allBtns = optionsContainer.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (selectedStr === correctStr) {
      btn.classList.add('correct-highlight');
      stars += 1;
      correctCount += 1;
      starCount.textContent = stars;
      starCount.parentElement.classList.add('star-pop');
      setTimeout(() => starCount.parentElement.classList.remove('star-pop'), 350);

      const praises = ['太棒了！', '你真聪明！', '好厉害！', '答对啦！', '真不错！'];
      const praise = praises[Math.floor(Math.random() * praises.length)];
      feedbackMsg.textContent = `✅ ${praise}`;
      feedbackMsg.className = 'feedback correct';
      playCorrectSound();
    } else {
      btn.classList.add('wrong-highlight');
      allBtns.forEach(b => {
        if (String(b.dataset.value) === correctStr) {
          b.classList.add('correct-highlight');
        }
      });
      feedbackMsg.textContent = `❌ 再想想哦，正确答案是 ${correctStr}`;
      feedbackMsg.className = 'feedback wrong';
      playWrongSound();
    }

    nextBtn.style.display = 'block';
    if (currentIndex === questions.length - 1) {
      nextBtn.textContent = '查看结果 🎉';
    } else {
      nextBtn.textContent = '下一题 ➡️';
    }

    const total = questions.length;
    const percent = ((currentIndex + 1) / total) * 100;
    progressFill.style.width = percent + '%';
    progressText.textContent = `${currentIndex + 1}/${total}`;
  }

  function goToNext() {

  // ==================== 年级选择 ====================

  // ==================== 速算24：整数运算与有解出题 ====================
  const game24Operators = { basic: ['+', '−'], advanced: ['+', '−', '×', '÷'] };

  function calculate24Value(a, b, operator, mode) {
    if (!Number.isSafeInteger(a) || !Number.isSafeInteger(b) ||
        !game24Operators[mode] || !game24Operators[mode].includes(operator)) return null;
    let value;
    if (operator === '+') value = a + b;
    if (operator === '−') value = a - b;
    if (operator === '×') value = a * b;
    if (operator === '÷') {
      if (b === 0 || a % b !== 0) return null;
      value = a / b;
    }
    if (!Number.isSafeInteger(value) || (mode === 'basic' && (value < 0 || value > 100))) return null;
    return value === 0 ? 0 : value;
  }

  function make24Cards(numbers) {
    return numbers.map((value, id) => ({ id, value, expression: String(value), used: 1 }));
  }

  function format24Number(value) {
    return value < 0 ? `(${value})` : String(value);
  }

  // 枚举两两合并的所有合法顺序；只缓存无解数值状态，重复数字仍是独立卡片。
  function find24Solution(cards, mode) {
    const failed = new Set();
    function search(nodes) {
      if (nodes.length === 1) return nodes[0].value === 24 ? [] : null;
      const key = nodes.map(n => n.value).sort((a, b) => a - b).join(',');
      if (failed.has(key)) return null;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          for (const operator of game24Operators[mode]) {
            const orders = (operator === '−' || operator === '÷') ? [[i, j], [j, i]] : [[i, j]];
            for (const [left, right] of orders) {
              const a = nodes[left], b = nodes[right];
              const value = calculate24Value(a.value, b.value, operator, mode);
              if (value === null) continue;
              const merged = {
                id: Math.max(...nodes.map(n => n.id)) + 1,
                value, used: a.used + b.used,
                expression: `(${a.expression} ${operator} ${b.expression})`
              };
              const rest = nodes.filter((_, index) => index !== i && index !== j);
              const tail = search([...rest, merged]);
              if (tail !== null) {
                return [{ leftId: a.id, rightId: b.id, a: a.value, b: b.value, operator, value }, ...tail];
              }
            }
          }
        }
      }
      failed.add(key);
      return null;
    }
    return search(cards);
  }

  function generate24Puzzle(mode, previousKey = '') {
    const maxNumber = mode === 'basic' ? 10 : 13;
    const wantSubtraction = mode === 'basic' && Math.random() < 0.4;
    for (let attempt = 0; attempt < 160; attempt++) {
      const numbers = Array.from({ length: 4 }, () => 1 + Math.floor(Math.random() * maxNumber));
      const key = [...numbers].sort((a, b) => a - b).join(',');
      if (key === previousKey) continue;
      if (wantSubtraction && numbers.reduce((sum, n) => sum + n, 0) === 24) continue;
      const cards = make24Cards(numbers);
      // 进阶题不能仅凭加减法完成，让两种难度有实际区别。
      if (mode === 'advanced' && find24Solution(cards, 'basic') !== null) continue;
      const solution = find24Solution(cards, mode);
      if (solution !== null) return { numbers, key, solution };
    }
    // 随机尝试有上限，兜底题同样通过求解器验证，且避开上一题。
    const fallback = mode === 'basic' ? [[3, 5, 7, 9], [10, 9, 8, 3]] : [[2, 3, 4, 6], [1, 2, 3, 4]];
    const numbers = shuffle(fallback.find(hand => [...hand].sort((a, b) => a - b).join(',') !== previousKey));
    return { numbers, key: [...numbers].sort((a, b) => a - b).join(','), solution: find24Solution(make24Cards(numbers), mode) };
  }

  const game24 = {
    mode: 'basic',
    rounds: { basic: null, advanced: null },
    counts: { basic: 0, advanced: 0 },
    completed: { basic: 0, advanced: 0 }
  };
  const game24UI = {};
  ['Screen', 'Score', 'Round', 'Rules', 'Hand', 'Numbers', 'Expression', 'Status', 'History', 'Steps',
    'Answer', 'SwapBtn', 'CalculateBtn', 'UndoBtn', 'ResetBtn', 'HintBtn', 'NewBtn', 'AnswerBtn'].forEach(name => {
    game24UI[name] = document.getElementById('game24' + name);
  });
  const current24Round = () => game24.rounds[game24.mode];
  const is24Solved = round => round.cards.length === 1 && round.cards[0].used === 4 && round.cards[0].value === 24;

  function showGames() {
    homeScreen.classList.add('hidden');
    quizScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    game24UI.Screen.classList.add('hidden');
    document.getElementById('gamesScreen').classList.remove('hidden');
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }

  function start24Game(mode = game24.mode) {
    if (!game24Operators[mode]) return;
    game24.mode = mode;
    homeScreen.classList.add('hidden');
    quizScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    document.getElementById('gamesScreen').classList.add('hidden');
    game24UI.Screen.classList.remove('hidden');
    if (!current24Round()) new24Puzzle();
    else render24Game();
  }

  function new24Puzzle() {
    const old = current24Round();
    const puzzle = generate24Puzzle(game24.mode, old ? old.key : '');
    game24.counts[game24.mode]++;
    game24.rounds[game24.mode] = {
      ...puzzle, cards: make24Cards(puzzle.numbers), selected: [], operator: null,
      history: [], steps: [], nextId: 4, awarded: false, showAnswer: false,
      message: '每张卡片都要用到，先选两个数字试试看。', kind: ''
    };
    render24Game();
  }

  function set24Message(message, kind = '') {
    const round = current24Round();
    round.message = message;
    round.kind = kind;
    game24UI.Status.textContent = message;
    game24UI.Status.dataset.kind = kind;
  }

  function step24Text(step) {
    return `${format24Number(step.a)} ${step.operator} ${format24Number(step.b)} = ${step.value}`;
  }

  function render24Game() {
    const round = current24Round();
    const solved = is24Solved(round);
    const finished = round.cards.length === 1;
    document.querySelectorAll('[data-game24-mode]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.game24Mode === game24.mode));
    });
    document.querySelectorAll('[data-game24-op]').forEach(button => {
      button.classList.toggle('hidden', !game24Operators[game24.mode].includes(button.dataset.game24Op));
      button.setAttribute('aria-pressed', String(round.operator === button.dataset.game24Op));
      button.disabled = finished;
    });
    game24UI.Score.textContent = `已完成 ${game24.completed[game24.mode]} 题`;
    game24UI.Round.textContent = `第 ${game24.counts[game24.mode]} 题`;
    game24UI.Rules.textContent = game24.mode === 'basic'
      ? '四个数各用一次，只用加减法。每一步不出现负数，最后得到 24。'
      : '四个数各用一次，可用加减乘除。除法必须整除，可以出现负整数。';
    game24UI.Hand.textContent = `本题数字：${round.numbers.join(' · ')}　｜　还剩 ${round.cards.length} 张卡`;
    game24UI.Numbers.replaceChildren();
    round.cards.forEach(card => {
      const button = document.createElement('button');
      const selectedIndex = round.selected.indexOf(card.id);
      button.className = 'game24-number' + (solved ? ' is-win' : '');
      button.dataset.cardId = card.id;
      button.setAttribute('aria-pressed', String(selectedIndex !== -1));
      button.setAttribute('aria-label', `${card.value}，${card.used === 1 ? '原始数字卡' : '由' + card.used + '张卡合成'}${selectedIndex !== -1 ? '，第' + (selectedIndex + 1) + '个数' : ''}`);
      button.title = card.expression;
      button.disabled = finished;
      const value = document.createElement('strong');
      value.textContent = card.value;
      const label = document.createElement('small');
      label.textContent = selectedIndex !== -1 ? `第 ${selectedIndex + 1} 个数` : card.used > 1 ? `${card.used} 张合成` : '点我选择';
      button.append(value, label);
      game24UI.Numbers.appendChild(button);
    });
    const selectedCards = round.selected.map(id => round.cards.find(card => card.id === id));
    game24UI.Expression.textContent = `${selectedCards[0] ? format24Number(selectedCards[0].value) : '□'} ${round.operator || '?'} ${selectedCards[1] ? format24Number(selectedCards[1].value) : '□'} = ?`;
    game24UI.SwapBtn.disabled = round.selected.length !== 2;
    game24UI.CalculateBtn.disabled = finished || round.selected.length !== 2 || !round.operator;
    game24UI.UndoBtn.disabled = round.history.length === 0;
    game24UI.HintBtn.disabled = solved;
    game24UI.NewBtn.textContent = solved ? '继续挑战下一题 →' : '换一道题 →';
    game24UI.Steps.replaceChildren();
    round.steps.forEach(step => {
      const item = document.createElement('li');
      item.textContent = step24Text(step);
      game24UI.Steps.appendChild(item);
    });
    game24UI.History.classList.toggle('hidden', !round.steps.length);
    game24UI.Answer.replaceChildren();
    game24UI.Answer.classList.toggle('hidden', !round.showAnswer);
    game24UI.AnswerBtn.setAttribute('aria-expanded', String(round.showAnswer));
    game24UI.AnswerBtn.textContent = round.showAnswer ? '收起解法' : '看看一种解法';
    if (round.showAnswer) {
      const title = document.createElement('strong');
      title.textContent = '从本题最初的四个数开始：';
      game24UI.Answer.appendChild(title);
      round.solution.forEach((step, index) => {
        const line = document.createElement('p');
        line.textContent = `${index + 1}. ${step24Text(step)}`;
        game24UI.Answer.appendChild(line);
      });
    }
    set24Message(round.message, round.kind);
  }

  function select24Card(id) {
    const round = current24Round();
    if (round.cards.length < 2 || !round.cards.some(card => card.id === id)) return;
    const index = round.selected.indexOf(id);
    if (index !== -1) round.selected.splice(index, 1);
    else if (round.selected.length < 2) round.selected.push(id);
    else {
      set24Message('已经选了两个数。点一下已选卡片可以取消选择。');
      return;
    }
    round.message = round.selected.length === 2
      ? (round.operator ? '准备好啦，点“算一下”。' : '选一个运算符，再点“算一下”。')
      : '按先后顺序选两个数，点已选卡片可以取消。';
    round.kind = '';
    render24Game();
  }

  function calculate24Step() {
    const round = current24Round();
    if (round.selected.length !== 2 || !round.operator || round.cards.length < 2) return;
    const [a, b] = round.selected.map(id => round.cards.find(card => card.id === id));
    if (!a || !b || a.id === b.id) return;
    const value = calculate24Value(a.value, b.value, round.operator, game24.mode);
    if (value === null) {
      if (round.operator === '÷' && b.value === 0) set24Message('0 不能作除数，换一个数或运算符吧。', 'error');
      else if (round.operator === '÷') set24Message('这一步不能整除。我们只算整数，试试交换顺序或换个运算符。', 'error');
      else if (game24.mode === 'basic' && a.value < b.value && round.operator === '−') set24Message('基础版不算负数。试试“交换顺序”，用大数减小数。', 'error');
      else set24Message('这个结果超出了本关的计算范围，换一种算法试试。', 'error');
      return;
    }
    round.history.push({ cards: round.cards.map(card => ({ ...card })), steps: [...round.steps] });
    const step = { a: a.value, b: b.value, operator: round.operator, value };
    round.steps.push(step);
    round.cards = round.cards.filter(card => !round.selected.includes(card.id));
    round.cards.push({ id: round.nextId++, value, used: a.used + b.used, expression: `(${a.expression} ${round.operator} ${b.expression})` });
    round.selected = [];
    round.operator = null;
    round.kind = '';
    if (is24Solved(round)) {
      if (!round.awarded) {
        round.awarded = true;
        game24.completed[game24.mode]++;
        playCorrectSound();
      }
      round.message = '🎉 算对啦！四个数都用上了，结果正好是 24！';
      round.kind = 'success';
    } else if (round.cards.length === 1) {
      round.message = `这次算出了 ${value}，离目标还差一点。撤销一步或重新算，试试其他方法。`;
      round.kind = 'error';
    } else {
      round.message = value === 24
        ? '已经出现 24 啦！不过还要用完剩下的卡片，最后只留一张 24。'
        : `${step24Text(step)}，继续用剩下的卡片计算吧。`;
    }
    render24Game();
  }

  function undo24Step() {
    const round = current24Round();
    const previous = round.history.pop();
    if (!previous) return;
    round.cards = previous.cards;
    round.steps = previous.steps;
    round.selected = [];
    round.operator = null;
    round.message = '已撤销一步，换一种方法试试看。';
    round.kind = '';
    render24Game();
  }

  function reset24Puzzle() {
    const round = current24Round();
    round.cards = make24Cards(round.numbers);
    round.history = [];
    round.steps = [];
    round.selected = [];
    round.operator = null;
    round.showAnswer = false;
    round.nextId = 4;
    round.message = '回到最初的四张卡片，再想一种算法吧。';
    round.kind = '';
    // 同一道题撤销或重算后再次完成，不重复增加完成数。
    render24Game();
  }

  function hint24Step() {
    const round = current24Round();
    if (is24Solved(round)) return;
    const solution = find24Solution(round.cards, game24.mode);
    if (solution === null) {
      set24Message('按现在的结果已经算不出 24 了。撤销一步，或点“重新算”再试试。');
      return;
    }
    const step = solution[0];
    round.selected = [step.leftId, step.rightId];
    round.operator = step.operator;
    round.message = `💡 试试 ${format24Number(step.a)} ${step.operator} ${format24Number(step.b)}，选好啦，自己算一下！`;
    round.kind = '';
    render24Game();
  }

  document.getElementById('gamesEntryBtn').addEventListener('click', showGames);
  document.getElementById('gamesHomeBtn').addEventListener('click', goHome);
  document.getElementById('openGame24Btn').addEventListener('click', () => start24Game());
  document.getElementById('game24BackBtn').addEventListener('click', showGames);
  document.querySelectorAll('[data-game24-mode]').forEach(button => {
    button.addEventListener('click', () => start24Game(button.dataset.game24Mode));
  });
  document.querySelectorAll('[data-game24-op]').forEach(button => {
    button.addEventListener('click', () => {
      const round = current24Round();
      const operator = button.dataset.game24Op;
      if (round.cards.length < 2 || !game24Operators[game24.mode].includes(operator)) return;
      round.operator = operator;
      round.message = round.selected.length === 2 ? '点“算一下”，把这两张卡合成一张。' : '再按顺序选择两个数字。';
      round.kind = '';
      render24Game();
    });
  });
  game24UI.Numbers.addEventListener('click', event => {
    const button = event.target.closest('[data-card-id]');
    if (button && !button.disabled) select24Card(Number(button.dataset.cardId));
  });
  game24UI.SwapBtn.addEventListener('click', () => {
    current24Round().selected.reverse();
    current24Round().message = '已交换两个数的顺序。';
    current24Round().kind = '';
    render24Game();
  });
  game24UI.CalculateBtn.addEventListener('click', calculate24Step);
  game24UI.UndoBtn.addEventListener('click', undo24Step);
  game24UI.ResetBtn.addEventListener('click', reset24Puzzle);
  game24UI.HintBtn.addEventListener('click', hint24Step);
  game24UI.NewBtn.addEventListener('click', new24Puzzle);
  game24UI.AnswerBtn.addEventListener('click', () => {
    current24Round().showAnswer = !current24Round().showAnswer;
    render24Game();
  });

  window.addEventListener('load', () => {
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
    }
  });
</script>
</body>
</html>
